[package]
name = "x-upgrade"
version = "0.1.0"
edition = "2021"
description = "Nibiru upgrade scheduling and execution records"
homepage = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# features.library: Use the library feature to disable all
# instantiate/execute/query exports, so other crates can depend on the
# message types.
library = []

[dependencies]
nibiru-std = { workspace = true }
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
easy-addr = { workspace = true }
serde_json = { workspace = true }
