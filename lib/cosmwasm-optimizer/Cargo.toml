[package]
name = "sai-wasm-optimizer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NibiruChain/nibiru"
homepage = "https://github.com/NibiruChain/nibiru/tree/main/lib/cosmwasm-optimizer"
readme = "README.md"
description = "Pinned ARM64 and AMD64 CosmWasm contract builds and Nibiru VM validation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cosmwasm-vm = { path = "../cosmwasm-vm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
wat = "1"
cosmwasm-std = "1.5.11"

# Native release assets live alongside chain releases, under their own tag prefix.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/sai-wasm-optimizer/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]
