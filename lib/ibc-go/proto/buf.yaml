version: v1
name: buf.build/cosmos/ibc
deps:
  # Root buf.work.yaml: the local lib/cosmos-sdk/proto module shadows this
  # dep. Buf rejects two refs for one module in a workspace, so this ref
  # must match the one in proto/buf.yaml.
  - buf.build/cosmos/cosmos-sdk:v0.47.11
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
  - buf.build/cosmos/ics23
breaking:
  use:
    - FILE
lint:
  use:
    - DEFAULT
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
  except:
    - UNARY_RPC
    - COMMENT_FIELD
    - SERVICE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
