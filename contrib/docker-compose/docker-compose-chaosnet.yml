name: chaosnet

# Shared settings for the multival profile services below.
x-multival-node: &multival-node
  image: ${MULTIVAL_IMAGE:-nibiru-multival:local}
  # multival-genesis builds the image; the validators reuse it.
  pull_policy: never
  profiles: [multival]
  environment:
    MULTIVAL_N: 4
    CHAIN_ID: nibiru-localnet-3
    NET_DIR: /net
    # Funded for EVM load. Must match contrib/scripts/determinism keys.
    EVM_LOAD_ADDRS: >-
      0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      0x4751b483f683278FcD86CB1B0581a292aabE8eD9
      0x90F79bf6EB2c4f870365E785982E1f101E93b906
  volumes:
    - multival-data:/net:rw
    - type: bind
      source: ../scripts
      target: /scripts
      read_only: true
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:26657/status"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

x-multival-after-genesis: &multival-after-genesis
  multival-genesis:
    condition: service_completed_successfully

services:
  nibiru-0:
    build:
      context: ../.. # nibiru project folder
      target: chaosnet
      args:
        MNEMONIC: guard cream sadness conduct invite crumble clock pudding hole grit liar hotel maid produce squeeze return argue turtle know drive eight casino maze host
        CHAIN_ID: nibiru-localnet-0
        RPC_PORT: 26657
        GRPC_PORT: 9090
        LCD_PORT: 1317
    ports:
      - 26657:26657
      - 1317:1317
      - 9090:9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - nibid-data-0:/root/.nibid/data:rw

  nibiru-1:
    build:
      context: ../.. # nibiru project folder
      target: chaosnet
      args:
        MNEMONIC: gallery grass trick siren sunset chimney crawl hover eagle rug dice quick false dizzy abandon issue history transfer lyrics clever any narrow taste exotic
        CHAIN_ID: nibiru-localnet-1
        RPC_PORT: 36657
        GRPC_PORT: 19090
        LCD_PORT: 11317
    profiles: [ibc]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:36657"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - 36657:36657
      - 11317:11317
      - 19090:19090
    volumes:
      - nibid-data-1:/root/.nibid/data:rw

  hermes-keys-task-0:
    image: informalsystems/hermes:1.6.0
    profiles: [ibc]
    user: root
    command:
      [
        "--config",
        "/root/.hermes/config.toml",
        "keys",
        "add",
        "--key-name",
        "nibiru-0-validator",
        "--chain",
        "nibiru-localnet-0",
        "--mnemonic-file",
        "/root/nibiru-0-validator-mnemonic",
      ]
    volumes:
      - type: bind
        source: ../templates/hermes.toml
        target: /root/.hermes/config.toml
      - type: bind
        source: ../templates/nibiru-0-validator-mnemonic
        target: /root/nibiru-0-validator-mnemonic
      - hermes-keys-data:/root/.hermes/keys
    depends_on:
      nibiru-0:
        condition: service_healthy
      nibiru-1:
        condition: service_healthy

  hermes-keys-task-1:
    image: informalsystems/hermes:1.6.0
    profiles: [ibc]
    user: root
    command:
      [
        "--config",
        "/root/.hermes/config.toml",
        "keys",
        "add",
        "--key-name",
        "nibiru-1-validator",
        "--chain",
        "nibiru-localnet-1",
        "--mnemonic-file",
        "/root/nibiru-1-validator-mnemonic",
      ]
    volumes:
      - type: bind
        source: ../templates/hermes.toml
        target: /root/.hermes/config.toml
      - type: bind
        source: ../templates/nibiru-1-validator-mnemonic
        target: /root/nibiru-1-validator-mnemonic
      - hermes-keys-data:/root/.hermes/keys
    depends_on:
      nibiru-0:
        condition: service_healthy
      nibiru-1:
        condition: service_healthy
      hermes-keys-task-0:
        condition: service_completed_successfully

  hermes-client-connection-channel-task:
    image: informalsystems/hermes:1.6.0
    profiles: [ibc]
    user: root
    command:
      [
        "--config",
        "/root/.hermes/config.toml",
        "create",
        "channel",
        "--a-chain",
        "nibiru-localnet-0",
        "--b-chain",
        "nibiru-localnet-1",
        "--a-port",
        "transfer",
        "--b-port",
        "transfer",
        "--new-client-connection",
        "--yes",
      ]
    volumes:
      - type: bind
        source: ../templates/hermes.toml
        target: /root/.hermes/config.toml
      - hermes-keys-data:/root/.hermes/keys
    depends_on:
      nibiru-0:
        condition: service_healthy
      nibiru-1:
        condition: service_healthy
      hermes-keys-task-1:
        condition: service_completed_successfully

  hermes:
    image: informalsystems/hermes:1.6.0
    profiles: [ibc]
    restart: always
    user: root
    command: ["start"]
    volumes:
      - type: bind
        source: ../templates/hermes.toml
        target: /root/.hermes/config.toml
      - hermes-keys-data:/root/.hermes/keys
    ports:
      - 3000:3000
      - 3001:3001
    depends_on:
      nibiru-0:
        condition: service_healthy
      nibiru-1:
        condition: service_healthy
      hermes-client-connection-channel-task:
        condition: service_completed_successfully

  heartmonitor-db:
    image: postgres:14
    profiles: [heartmonitor]
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heart-monitor
    ports:
      - 5433:5432

  heartmonitor:
    image: ghcr.io/nibiruchain/go-heartmonitor:latest
    platform: linux/amd64
    profiles: [heartmonitor]
    restart: always
    command: --clean
    volumes:
      - nibid-data-0:/heartmonitor/.nibid/data:ro
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@heartmonitor-db:5432/heart-monitor?sslmode=disable
      - TENDERMINT_RPC_ENDPOINT=http://nibiru-0:26657
      - GRPC_ENDPOINT=tcp://nibiru-0:9090
      - GRPC_INSECURE=true
      - NO_PARTITIONS=true
      - CHAIN_DB_PATH=/heartmonitor/.nibid/data
    depends_on:
      heartmonitor-db:
        condition: service_started

  graphql:
    image: ghcr.io/nibiruchain/go-heartmonitor:latest
    platform: linux/amd64
    profiles: [heartmonitor]
    restart: always
    command: --graphql
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@heartmonitor-db:5432/heart-monitor?sslmode=disable
      - NO_PARTITIONS=true
    ports:
      - 5555:5555
    depends_on:
      heartmonitor:
        condition: service_started

  # ----- Profile "multival": 4 validators on one chain ----------
  # One genesis with a gentx per validator, built by
  # contrib/scripts/multival-genesis.sh into the multival-data volume.
  # Used by `just chaos up-multival` and `just chaos determinism`.
  # See spec/02-chaosnet.md.
  multival-genesis:
    <<: *multival-node
    build:
      context: ../.. # nibiru project folder
      dockerfile: contrib/docker-compose/Dockerfile.multival
      args:
        NIBID_EXTRA_TAGS: ${MULTIVAL_BUILD_TAGS:-}
    restart: "no"
    entrypoint: ["bash", "/scripts/multival-genesis.sh"]
    command: !reset []
    healthcheck:
      disable: true

  nibiru-val-0:
    <<: *multival-node
    command: ["start", "--home", "/net/val-0"]
    depends_on: *multival-after-genesis
    ports:
      - 46657:26657 # Nibiru BFT RPC
      - 48545:8545 # EVM JSON-RPC

  nibiru-val-1:
    <<: *multival-node
    command: ["start", "--home", "/net/val-1"]
    depends_on: *multival-after-genesis
    ports:
      - 46658:26657
      - 48546:8545

  nibiru-val-2:
    <<: *multival-node
    # `just chaos determinism-selftest-one` runs this validator alone on the
    # fault-injection image.
    image: ${MULTIVAL_IMAGE_VAL2:-${MULTIVAL_IMAGE:-nibiru-multival:local}}
    command: ["start", "--home", "/net/val-2"]
    depends_on: *multival-after-genesis
    ports:
      - 46659:26657
      - 48547:8545

  nibiru-val-3:
    <<: *multival-node
    command: ["start", "--home", "/net/val-3"]
    depends_on: *multival-after-genesis
    ports:
      - 46660:26657
      - 48548:8545

volumes:
  nibid-data-0:
  nibid-data-1:
  hermes-keys-data:
  multival-data:
