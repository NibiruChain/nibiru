ignore:
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/mocks/.*"
  - "**/kubernetes_mock/.*"
  - "pkg"
  - "api"
  - "test"

codecov:
  require_ci_to_pass: true
parsers:
  gcov:
    branch_detection:
      loop: yes
      macro: no
      method: no
      conditional: yes
coverage:
  range: 40..92
  round: down
  precision: 2
  # Report project and patch coverage without enforcing a coverage minimum.
  # [Informational checks](https://docs.codecov.com/docs/commit-status#informational)
  # To enforce coverage later, disable informational mode and set target/threshold.
  # [Coverage targets](https://docs.codecov.com/docs/commit-status#target)
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Show coverage figures, comparisons, file details, and report links.
# Comment presentation is separate from the informational status checks above.
# [Full report format](https://docs.codecov.com/docs/changing-your-pr-comment-format)
# [Comment options](https://docs.codecov.com/docs/pull-request-comments)
comment:
  layout: "header, diff, files, footer"
  hide_project_coverage: false
  behavior: default
  require_changes: false # Report even when coverage is unchanged.
  require_base: false # [true :: must have a base report to post]
  require_head: true # [true :: must have a head report to post]
