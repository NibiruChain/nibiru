name: x-consensus artifact
# x-consensus artifact rebuilds the embedded x-consensus contract with the
# AMD64 release optimizer and checks it against x/xconsensus/x_consensus.wasm.
# The embedded bytes become chain state at genesis and in the v2.22 upgrade,
# and their checksum fixes the contract's instantiate2 address, so the binary
# must be reproducible from source. On a mismatch the job fails and uploads
# the release build, which is the artifact to commit.

on:
  pull_request:
    paths:
      - "wasm-contracts/x-consensus/**"
      - "x/xconsensus/x_consensus.wasm"
      - "x/xconsensus/x_consensus.go"
      - "Cargo.lock"
      - "Cargo.toml"
      - "just-rs.just"
      - "lib/cosmwasm-optimizer/**"
      - ".github/workflows/x-consensus-artifact.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@just
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-x-consensus-${{ hashFiles('Cargo.lock') }}
      - name: Build x-consensus in release mode
        run: |
          just rs optimizer build --manifest-path Cargo.toml -p x-consensus \
            --output-dir wasm-contracts/artifacts --mode release
          just rs wasm-check
      - name: Upload the release build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-consensus-release
          path: wasm-contracts/artifacts/x_consensus.wasm
          if-no-files-found: error
      - name: Compare with the embedded artifact
        run: |
          built="$(sha256sum wasm-contracts/artifacts/x_consensus.wasm | cut -d' ' -f1)"
          embedded="$(sha256sum x/xconsensus/x_consensus.wasm | cut -d' ' -f1)"
          constant="$(sed -n 's/^const XConsensusWasmSHA256 = "\([0-9a-f]*\)"$/\1/p' x/xconsensus/x_consensus.go)"
          echo "release build: $built"
          echo "embedded file: $embedded"
          echo "Go constant:   $constant"
          if [ "$built" != "$embedded" ] || [ "$built" != "$constant" ]; then
            echo "::error::x/xconsensus/x_consensus.wasm is not the release build of wasm-contracts/x-consensus. Download artifact x-consensus-release from this run, commit it, and set XConsensusWasmSHA256 to $built."
            exit 1
          fi
