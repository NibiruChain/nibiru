name: Upgrade Handler Check

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to check with the current checker
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  check-upgrade-handler:
    name: Validate Upgrade Handler exists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test release compatibility checks
        run: go test ./contrib/scripts

      - name: Run Upgrade Handler Checker
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: go run ./contrib/scripts/upgrade-handler-check.go "$RELEASE_TAG"
